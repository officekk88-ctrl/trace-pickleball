name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  repo-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repository bootstrap files
        run: |
          test -f README.md
          test -f prd.md
          test -f CONTRIBUTING.md
          test -d docs

